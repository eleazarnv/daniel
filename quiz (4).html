<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniel · Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --red: #B91C1C; --gold: #D4A017; --cream: #FAF6EE; --text: #1a1208; --text-muted: #6b5a3a; }
  html, body { min-height: 100vh; background: var(--cream); font-family: 'Crimson Pro', Georgia, serif; color: var(--text); overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background-image: radial-gradient(ellipse at 20% 20%, rgba(212,160,23,0.08) 0%, transparent 60%), radial-gradient(ellipse at 80% 80%, rgba(185,28,28,0.06) 0%, transparent 60%); pointer-events: none; z-index: 0; }
  .watermark { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-18deg); width: 480px; height: 480px; opacity: 0.04; pointer-events: none; z-index: 0; background-image: url('1780025373164_image.png'); background-size: contain; background-repeat: no-repeat; background-position: center; }

  /* COUNTDOWN */
  #countdown-overlay { position: fixed; inset: 0; background: rgba(10,6,2,0.72); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; animation: overlayIn 0.5s ease forwards; }
  #countdown-overlay.hiding { animation: overlayOut 0.6s ease forwards; }
  .countdown-label { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 6px; color: rgba(212,160,23,0.7); text-transform: uppercase; animation: fadeUp 0.5s ease 0.2s both; }
  .countdown-num { font-family: 'Cinzel', serif; font-size: clamp(6rem, 20vw, 10rem); font-weight: 700; color: #fff; line-height: 1; text-shadow: 0 0 60px rgba(212,160,23,0.4); }
  .countdown-num.tick { animation: tick 0.4s ease; }
  .countdown-chapter { font-size: 1.1rem; font-style: italic; color: rgba(255,255,255,0.45); letter-spacing: 1px; animation: fadeUp 0.5s ease 0.35s both; }
  .countdown-ring { position: absolute; width: 220px; height: 220px; border-radius: 50%; border: 1px solid rgba(212,160,23,0.15); animation: ringPulse 1s ease infinite; pointer-events: none; }

  /* PAGE */
  .page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2.5rem 1.5rem 4rem; opacity: 0; transition: opacity 0.5s ease; }
  .page.visible { opacity: 1; }

  /* TOPBAR */
  .topbar { width: 100%; max-width: 780px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 2.5rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(212,160,23,0.3); }
  .topbar-left { display: flex; align-items: center; gap: 0.6rem; }
  .topbar-left img { height: 36px; }
  .topbar-left span { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; }
  .back-btn { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; text-decoration: none; display: flex; align-items: center; gap: 0.4rem; transition: color 0.2s; }
  .back-btn:hover { color: var(--red); }
  .back-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

  /* TIMER */
  .timer-wrap { width: 100%; max-width: 780px; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.75rem; }
  .timer-track { flex: 1; height: 5px; background: rgba(212,160,23,0.15); border-radius: 3px; overflow: hidden; }
  .timer-fill { height: 100%; width: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); border-radius: 3px; transition: width 1s linear, background 0.5s linear; }
  .timer-fill.warning { background: linear-gradient(90deg, #7f1d1d, var(--red)); }
  .timer-num { font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600; color: var(--gold); min-width: 22px; text-align: right; transition: color 0.3s; }
  .timer-num.warning { color: var(--red); }

  /* PROGRESS */
  .progress-wrap { width: 100%; max-width: 780px; margin-bottom: 2.5rem; }
  .progress-info { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
  .progress-info span { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; }
  .progress-track { width: 100%; height: 3px; background: rgba(212,160,23,0.15); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); border-radius: 2px; transition: width 0.5s ease; }

  /* QUESTION */
  .q-card { width: 100%; max-width: 780px; background: rgba(255,255,255,0.7); border: 1px solid rgba(212,160,23,0.25); border-radius: 4px; padding: 2.5rem 2.5rem 2rem; margin-bottom: 1.5rem; animation: fadeUp 0.45s ease both; }
  .q-label { font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 4px; color: var(--gold); text-transform: uppercase; margin-bottom: 1.25rem; }
  .q-text { font-size: 1.35rem; font-weight: 400; line-height: 1.6; color: var(--text); }

  /* OPTIONS */
  .options { width: 100%; max-width: 780px; display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-bottom: 2rem; }
  .opt-btn { background: rgba(255,255,255,0.65); border: 1px solid rgba(212,160,23,0.25); border-radius: 4px; padding: 1.1rem 1.25rem; text-align: left; cursor: pointer; display: flex; align-items: flex-start; gap: 0.9rem; transition: border-color 0.2s, background 0.2s, transform 0.15s; font-family: 'Crimson Pro', Georgia, serif; animation: fadeUp 0.45s ease both; }
  .opt-btn:nth-child(1){animation-delay:0.05s} .opt-btn:nth-child(2){animation-delay:0.1s} .opt-btn:nth-child(3){animation-delay:0.15s} .opt-btn:nth-child(4){animation-delay:0.2s}
  .opt-btn:hover:not(:disabled) { border-color: rgba(212,160,23,0.55); background: rgba(255,255,255,0.9); transform: translateY(-2px); }
  .opt-letter { font-family: 'Cinzel', serif; font-size: 0.7rem; font-weight: 600; color: var(--gold); background: rgba(212,160,23,0.1); border: 1px solid rgba(212,160,23,0.25); border-radius: 2px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; transition: background 0.2s, color 0.2s, border-color 0.2s; }
  .opt-text { font-size: 1rem; line-height: 1.5; color: var(--text); }
  .opt-btn.correct { border-color: #16a34a; background: rgba(22,163,74,0.08); }
  .opt-btn.correct .opt-letter { background: #16a34a; color: white; border-color: #16a34a; }
  .opt-btn.wrong { border-color: var(--red); background: rgba(185,28,28,0.07); }
  .opt-btn.wrong .opt-letter { background: var(--red); color: white; border-color: var(--red); }
  .opt-btn.reveal-correct { border-color: #16a34a; background: rgba(22,163,74,0.06); }
  .opt-btn.reveal-correct .opt-letter { background: rgba(22,163,74,0.15); color: #16a34a; border-color: #16a34a; }
  .opt-btn:disabled { cursor: default; transform: none !important; }

  /* FEEDBACK */
  .feedback { width: 100%; max-width: 780px; padding: 0.9rem 1.25rem; border-radius: 4px; font-size: 1rem; font-style: italic; margin-bottom: 1.5rem; display: none; animation: fadeUp 0.3s ease both; }
  .feedback.correct-fb { display: block; background: rgba(22,163,74,0.08); border: 1px solid rgba(22,163,74,0.3); color: #15803d; }
  .feedback.wrong-fb { display: block; background: rgba(185,28,28,0.07); border: 1px solid rgba(185,28,28,0.25); color: var(--red); }

  /* NEXT BTN */
  .next-btn { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: white; background: var(--red); border: none; padding: 0.9rem 2.5rem; border-radius: 2px; cursor: pointer; display: none; transition: background 0.2s, transform 0.15s; }
  .next-btn:hover { background: #991b1b; transform: translateY(-1px); }
  .next-btn.visible { display: inline-block; }

  /* RESULTS */
  #results-screen { display: none; position: relative; z-index: 1; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 1.5rem; text-align: center; }
  #results-screen.visible { display: flex; }
  .results-ornament { font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: 5px; color: var(--gold); text-transform: uppercase; margin-bottom: 1rem; }
  .results-title { font-family: 'Cinzel', serif; font-size: clamp(2rem, 6vw, 3.5rem); font-weight: 700; color: var(--text); margin-bottom: 0.5rem; }
  .results-score { font-family: 'Cinzel', serif; font-size: clamp(4rem, 12vw, 7rem); font-weight: 700; color: var(--red); line-height: 1; margin: 1rem 0; }
  .results-sub { font-size: 1.2rem; font-style: italic; color: var(--text-muted); margin-bottom: 0.5rem; }
  .results-message { font-size: 1rem; color: var(--text-muted); max-width: 400px; line-height: 1.7; margin-bottom: 2.5rem; }
  .results-divider { display: flex; align-items: center; gap: 1rem; width: 200px; margin: 1.5rem auto; }
  .results-divider::before, .results-divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--gold)); }
  .results-divider::after { background: linear-gradient(to left, transparent, var(--gold)); }
  .results-divider-diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }
  .results-actions { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
  .btn-primary { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: white; background: var(--red); border: none; padding: 0.9rem 2rem; border-radius: 2px; cursor: pointer; transition: background 0.2s, transform 0.15s; text-decoration: none; display: inline-block; }
  .btn-primary:hover { background: #991b1b; transform: translateY(-1px); }
  .btn-secondary { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--text-muted); background: transparent; border: 1px solid rgba(212,160,23,0.4); padding: 0.9rem 2rem; border-radius: 2px; cursor: pointer; transition: border-color 0.2s, color 0.2s, transform 0.15s; text-decoration: none; display: inline-block; }
  .btn-secondary:hover { border-color: var(--gold); color: var(--text); transform: translateY(-1px); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes overlayOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes tick { 0% { transform: scale(1.25); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes ringPulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.08); opacity: 0.15; } }
  @media (max-width: 600px) { .options { grid-template-columns: 1fr; } .q-card { padding: 1.75rem 1.25rem 1.5rem; } }
</style>
</head>

const ROMANOS = { 1:'I', 2:'II', 3:'III', 4:'IV', 5:'V', 6:'VI' };
const LETRAS = ['A','B','C','D'];

function getCapFromURL() {
  const c = parseInt(localStorage.getItem('cap'));
  return (c >= 1 && c <= 6) ? c : 1;
}

function getModeFromStorage() {
  return localStorage.getItem('mode') === 'egw' ? 'egw' : 'daniel';
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let capNum, preguntas, current, score, answered, currentShuffled;
let timerInterval = null, timeLeft = 20;

function initCap() {
  capNum = getCapFromURL();
  const mode = getModeFromStorage();
  const roman = ROMANOS[capNum];

  // Choose data source
  const banco = mode === 'egw' ? EGW_CAPITULOS : CAPITULOS;
  const cap = banco[capNum];

  const modeLabel = mode === 'egw' ? 'EGW' : 'Daniel';
  document.getElementById('topbar-cap').textContent = modeLabel + ' · Capítulo ' + roman;
  document.getElementById('countdown-chapter').textContent = modeLabel + ' · Capítulo ' + roman;
  document.getElementById('results-title').textContent = modeLabel + ' · Capítulo ' + roman;
  preguntas = shuffle(cap.preguntas);
  current = 0; score = 0; answered = false;
}

function loadQuestion() {
  answered = false;
  const q = preguntas[current];
  const total = preguntas.length;
  document.getElementById('q-label').textContent = 'Pregunta ' + (current + 1);
  document.getElementById('q-text').textContent = q.pregunta;
  document.getElementById('progress-label').textContent = 'Pregunta ' + (current + 1) + ' de ' + total;
  document.getElementById('score-label').textContent = score + ' correcta' + (score !== 1 ? 's' : '');
  document.getElementById('progress-fill').style.width = ((current / total) * 100) + '%';

  const correctText = q.opciones[q.correcta];
  const shuffled = shuffle(q.opciones);
  currentShuffled = shuffled;
  const newCorrectIdx = shuffled.indexOf(correctText);

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';
  shuffled.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = '<span class="opt-letter">' + LETRAS[i] + '</span><span class="opt-text">' + opt + '</span>';
    btn.onclick = () => selectAnswer(i, newCorrectIdx);
    optionsEl.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('next-btn').classList.remove('visible');
  document.getElementById('next-btn').textContent = current === preguntas.length - 1 ? 'Ver resultado →' : 'Siguiente pregunta →';

  const card = document.getElementById('q-card');
  card.style.animation = 'none'; card.offsetHeight; card.style.animation = '';

  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 20;
  const fill = document.getElementById('timer-fill');
  const num = document.getElementById('timer-num');
  fill.style.width = '100%';
  fill.classList.remove('warning');
  num.classList.remove('warning');
  num.textContent = '20';

  timerInterval = setInterval(() => {
    timeLeft--;
    fill.style.width = ((timeLeft / 20) * 100) + '%';
    num.textContent = timeLeft;
    if (timeLeft <= 7) { fill.classList.add('warning'); num.classList.add('warning'); }
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) {
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach(b => b.disabled = true);
        const correctIdx = currentShuffled.indexOf(preguntas[current].opciones[preguntas[current].correcta]);
        btns[correctIdx].classList.add('reveal-correct');
        const fb = document.getElementById('feedback');
        fb.textContent = '⏱ Tiempo agotado. La respuesta correcta era: ' + currentShuffled[correctIdx];
        fb.className = 'feedback wrong-fb';
        answered = true;
        document.getElementById('next-btn').classList.add('visible');
      }
    }
  }, 1000);
}

function selectAnswer(chosen, correct) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach(b => b.disabled = true);
  const fb = document.getElementById('feedback');
  if (chosen === correct) {
    btns[chosen].classList.add('correct');
    fb.textContent = '✓ ¡Correcto!';
    fb.className = 'feedback correct-fb';
    score++;
  } else {
    btns[chosen].classList.add('wrong');
    btns[correct].classList.add('reveal-correct');
    fb.textContent = '✗ Incorrecto. La respuesta correcta es: ' + currentShuffled[correct];
    fb.className = 'feedback wrong-fb';
  }
  document.getElementById('score-label').textContent = score + ' correcta' + (score !== 1 ? 's' : '');
  document.getElementById('next-btn').classList.add('visible');
}

function nextQuestion() {
  current++;
  if (current >= preguntas.length) showResults();
  else loadQuestion();
}

function showResults() {
  clearInterval(timerInterval);
  document.getElementById('quiz-page').style.display = 'none';
  document.getElementById('results-screen').classList.add('visible');
  const total = preguntas.length;
  const pct = Math.round((score / total) * 100);
  document.getElementById('results-score').textContent = score + '/' + total;
  document.getElementById('results-sub').textContent = pct + '% de respuestas correctas';
  let msg = '';
  if (pct === 100) msg = '¡Perfecto! Dominas el capítulo por completo. Excelente preparación.';
  else if (pct >= 80) msg = 'Muy bien. Tienes un sólido conocimiento del capítulo. Repasa las preguntas que fallaste.';
  else if (pct >= 60) msg = 'Bien, pero hay margen para mejorar. Te recomendamos releer el capítulo y volver a intentarlo.';
  else msg = 'Necesitas reforzar este capítulo. No te desanimes, ¡vuelve a intentarlo!';
  document.getElementById('results-message').textContent = msg;
}

function restartQuiz() {
  document.getElementById('results-screen').classList.remove('visible');
  document.getElementById('quiz-page').style.display = 'flex';
  initCap();
  loadQuestion();
}

function startCountdown() {
  initCap();
  let n = 5;
  const numEl = document.getElementById('countdown-num');
  const overlay = document.getElementById('countdown-overlay');
  numEl.classList.add('tick');
  setTimeout(() => numEl.classList.remove('tick'), 400);
  const interval = setInterval(() => {
    n--;
    if (n <= 0) {
      clearInterval(interval);
      overlay.classList.add('hiding');
      setTimeout(() => {
        overlay.style.display = 'none';
        document.getElementById('quiz-page').classList.add('visible');
        loadQuestion();
      }, 600);
    } else {
      numEl.textContent = n;
      numEl.classList.add('tick');
      setTimeout(() => numEl.classList.remove('tick'), 400);
    }
  }, 1000);
}

window.addEventListener('DOMContentLoaded', startCountdown);
</script>
